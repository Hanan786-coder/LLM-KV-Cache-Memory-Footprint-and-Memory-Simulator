[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kvsim"
version = "1.0.0"
description = "LLM KV-cache memory footprint, allocation and bandwidth simulator"
requires-python = ">=3.10"

[project.scripts]
kvsim = "kvsim.cli:main"

[tool.setuptools.packages.find]
include = ["kvsim*"]

[tool.setuptools.package-data]
kvsim = ["profiles/*/*.json"]
